<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SafeCity</title>
  <link rel="icon" type="image/png" href="../assets/images/safecity-logo.png">

  <!-- Fonts (fallback fonts are set in style.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../responsive.css">
  <link rel="stylesheet" href="../css/client.css">
</head>
<body>

<!-- NAVBAR (links are filled in by renderNavbar() in js/auth.js) -->
<nav class="site-navbar navbar navbar-expand-lg" aria-label="Main navigation">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <img src="../assets/images/safecity-logo.png" alt="SafeCity Logo" class="brand-logo">
      <div class="brand-text">
        <span class="brand-name">SafeCity</span>
        <span class="brand-sub">Crime Reporting Portal</span>
      </div>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div id="nav-links-container"></div>
    </div>
  </div>
</nav>

<!-- AUTH WRAPPER — centres the card between the navbar and the footer -->
<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo & title -->
    <div class="auth-logo">
      <img src="../assets/images/safecity-logo.png" alt="SafeCity Logo">
      <h2>SafeCity Portal</h2>
      <p>Crime Reporting &amp; Management System</p>
    </div>

    <!-- Tab switcher: Login | Register -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab-btn active" id="tab-login-btn"
              role="tab" aria-selected="true" onclick="switchTab('login')">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </button>
      <button class="auth-tab-btn" id="tab-register-btn"
              role="tab" aria-selected="false" onclick="switchTab('register')">
        <i class="bi bi-person-plus me-1"></i> Register
      </button>
    </div>

    <!-- ══ LOGIN TAB ══ -->
    <div class="auth-tab-panel active" id="tab-login">
      <form id="login-form" novalidate onsubmit="handleLogin(event)">

        <!-- Role selection: only a check against the account's real role -->
        <div class="mb-3">
          <label for="login-role" class="form-label">
            Login As <span class="required-star">*</span>
          </label>
          <select id="login-role" name="login-role" class="form-select">
            <option value="client" selected>Client</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="login-email" class="form-label">
            Email Address <span class="required-star">*</span>
          </label>
          <input type="email" id="login-email" name="login-email"
                 class="form-control" placeholder="your@email.com"
                 autocomplete="email"
                 data-validate="required|email" data-label="Email">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="login-password" class="form-label">
            Password <span class="required-star">*</span>
          </label>
          <!-- Password field + show/hide button (the wrapper is styled in client.css) -->
          <div class="pw-wrap">
            <input type="password" id="login-password" name="login-password"
                   class="form-control" placeholder="Enter your password"
                   autocomplete="current-password"
                   data-validate="required" data-label="Password">
            <button type="button" class="pw-toggle"
                    onclick="togglePasswordVisibility('login-password', this)"
                    aria-label="Show or hide password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback"></div>
        </div>

        <button type="submit" class="btn-submit-report w-100 mt-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </button>

      </form>

      <!-- The Anonymous Tip page is public, so it needs no login -->
      <div class="auth-divider">or</div>
      <a href="anonymous-tip.html" class="auth-alt-link">
        <i class="bi bi-person-slash"></i> Continue as Anonymous
      </a>
    </div>

    <!-- ══ REGISTER TAB (creates a Client account) ══ -->
    <div class="auth-tab-panel" id="tab-register">
      <form id="register-form" novalidate onsubmit="handleRegister(event)">

          <!-- Role selection: only a check against the account's real role -->
        <div class="mb-3">
          <label for="login-role" class="form-label">
            Login As <span class="required-star">*</span>
          </label>
          <select id="login-role" name="login-role" class="form-select">
            <option value="client" selected>Client</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="reg-name" class="form-label">
            Full Name <span class="required-star">*</span>
          </label>
          <input type="text" id="reg-name" name="reg-name"
                 class="form-control" placeholder="Your full name"
                 data-validate="required|minlength:3" data-label="Full name">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-email" class="form-label">
            Email Address <span class="required-star">*</span>
          </label>
          <input type="email" id="reg-email" name="reg-email"
                 class="form-control" placeholder="your@email.com"
                 data-validate="required|email" data-label="Email">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-phone" class="form-label">
            Phone Number <span class="required-star">*</span>
          </label>
          <input type="tel" id="reg-phone" name="reg-phone"
                 class="form-control" placeholder="10-digit mobile number"
                 data-validate="required|phone" data-label="Phone number">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-password" class="form-label">
            Password <span class="required-star">*</span>
          </label>
          <div class="pw-wrap">
            <input type="password" id="reg-password" name="reg-password"
                   class="form-control" placeholder="Min. 8 characters with letters and numbers"
                   data-validate="required|password" data-label="Password">
            <button type="button" class="pw-toggle"
                    onclick="togglePasswordVisibility('reg-password', this)"
                    aria-label="Show or hide password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <!-- Password strength indicator -->
          <div class="password-strength mt-1" id="reg-strength-bar">
            <div class="strength-bar"><div class="strength-fill"></div></div>
            <span class="strength-label"></span>
          </div>
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-confirm-password" class="form-label">
            Confirm Password <span class="required-star">*</span>
          </label>
          <input type="password" id="reg-confirm-password" name="reg-confirm-password"
                 class="form-control" placeholder="Re-enter your password"
                 data-validate="required" data-label="Confirm password">
          <div class="invalid-feedback"></div>
        </div>

        <button type="submit" class="btn-submit-report w-100 mt-2">
          <i class="bi bi-person-check me-1"></i> Create Account
        </button>

      </form>
    </div>

  </div><!-- /.auth-card -->
</div><!-- /.auth-wrapper -->

<!-- FOOTER (slim version, same on every client page) -->
<footer class="site-footer" aria-label="Site footer">
  <div class="container">
    <div class="footer-main">
      <div class="footer-brand-block">
        <img src="../assets/images/safecity-logo.png" alt="">
        <div>
          <div class="footer-brand-name">SafeCity</div>
          <p class="footer-tagline">Crime reporting and anonymous tips for a safer community.</p>
        </div>
      </div>
      <ul class="footer-links">
        <li><a href="anonymous-tip.html">Anonymous Tip</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </div>
    <div class="footer-bottom">
      &copy; <span id="current-year">2026</span> SafeCity · College project, not an official police or government website.
    </div>
  </div>
</footer>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../main.js"></script>
<script src="../js/validation.js"></script>
<!-- Auth: session management, login/register/navbar logic all in auth.js -->
<script src="../js/auth.js"></script>
<script>
  // Build the navbar links (login page is public — guests see the guest links)
  renderNavbar('../');

  // People who are already logged in do not need the login page:
  // send them to the right dashboard.
  (function () {
    var role = Auth.getRole();
    if (role === 'admin') {
      window.location.href = '../admin/dashboard.html';
    } else if (role === 'user') {
      window.location.href = 'user-dashboard.html';
    }
  })();

  // Real-time validation and the password strength bar
  document.addEventListener('DOMContentLoaded', function () {
    attachRealTimeValidation(document.getElementById('login-form'));
    attachRealTimeValidation(document.getElementById('register-form'));
    attachPasswordStrength(
      document.getElementById('reg-password'),
      document.getElementById('reg-strength-bar')
    );
  });
</script>
</body>
</html>
