<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – SafeCity</title>
  <link rel="icon" type="image/png" href="../assets/images/safecity-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../responsive.css">
  <link rel="stylesheet" href="../css/client.css">
</head>
<body>

<!-- NAVBAR (minimal — no active login link when on login page) -->
<nav class="site-navbar navbar navbar-expand-lg" aria-label="Main navigation">
  <div class="container">
    <a class="navbar-brand" href="../index.html">
      <img src="../assets/images/safecity-logo.png" alt="SafeCity Logo" class="brand-logo">
      <div class="brand-text">
        <span class="brand-name">SafeCity</span>
        <span class="brand-sub">Crime Reporting Portal</span>
      </div>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div id="nav-links-container" class="ms-auto"></div>
    </div>
  </div>
</nav>

<!-- AUTH WRAPPER — centres the card vertically -->
<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo & title -->
    <div class="auth-logo">
      <img src="../assets/images/safecity-logo.png" alt="SafeCity Logo">
      <h2>SafeCity Portal</h2>
      <p>Crime Reporting &amp; Management System</p>
    </div>

    <!-- Tab switcher: Login | Register -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab-btn active" id="tab-login-btn"
              role="tab" aria-selected="true" onclick="switchTab('login')">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </button>
      <button class="auth-tab-btn" id="tab-register-btn"
              role="tab" aria-selected="false" onclick="switchTab('register')">
        <i class="bi bi-person-plus me-1"></i> Register
      </button>
    </div>

    <!-- ══ LOGIN TAB ══ -->
    <div class="auth-tab-panel active" id="tab-login">
      <form id="login-form" novalidate onsubmit="handleLogin(event)">

        <div class="mb-3">
          <label for="login-email" class="form-label">
            Email Address <span class="required-star">*</span>
          </label>
          <input type="email" id="login-email" name="login-email"
                 class="form-control" placeholder="your@email.com"
                 autocomplete="email"
                 data-validate="required|email" data-label="Email">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="login-password" class="form-label">
            Password <span class="required-star">*</span>
          </label>
          <!-- Password field + toggle visibility button -->
          <div style="position:relative;">
            <input type="password" id="login-password" name="login-password"
                   class="form-control" placeholder="Enter your password"
                   autocomplete="current-password"
                   data-validate="required" data-label="Password"
                   style="padding-right: 2.5rem;">
            <button type="button" class="pw-toggle"
                    onclick="togglePasswordVisibility('login-password', this)"
                    aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback"></div>
        </div>

        <button type="submit" class="btn-submit-report w-100" style="margin-top:0.5rem;">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </button>

      </form>
    </div>

    <!-- ══ REGISTER TAB ══ -->
    <div class="auth-tab-panel" id="tab-register">
      <form id="register-form" novalidate onsubmit="handleRegister(event)">

        <div class="mb-3">
          <label for="reg-name" class="form-label">
            Full Name <span class="required-star">*</span>
          </label>
          <input type="text" id="reg-name" name="reg-name"
                 class="form-control" placeholder="Your full name"
                 data-validate="required|minlength:3" data-label="Full name">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-email" class="form-label">
            Email Address <span class="required-star">*</span>
          </label>
          <input type="email" id="reg-email" name="reg-email"
                 class="form-control" placeholder="your@email.com"
                 data-validate="required|email" data-label="Email">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-phone" class="form-label">
            Phone Number <span class="required-star">*</span>
          </label>
          <input type="tel" id="reg-phone" name="reg-phone"
                 class="form-control" placeholder="10-digit mobile number"
                 data-validate="required|phone" data-label="Phone number">
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-password" class="form-label">
            Password <span class="required-star">*</span>
          </label>
          <div style="position:relative;">
            <input type="password" id="reg-password" name="reg-password"
                   class="form-control" placeholder="Min. 8 characters with letters and numbers"
                   data-validate="required|password" data-label="Password"
                   style="padding-right: 2.5rem;">
            <button type="button" class="pw-toggle"
                    onclick="togglePasswordVisibility('reg-password', this)"
                    aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <!-- Password strength indicator -->
          <div class="password-strength mt-1" id="reg-strength-bar">
            <div class="strength-bar"><div class="strength-fill"></div></div>
            <span class="strength-label"></span>
          </div>
          <div class="invalid-feedback"></div>
        </div>

        <div class="mb-3">
          <label for="reg-confirm-password" class="form-label">
            Confirm Password <span class="required-star">*</span>
          </label>
          <input type="password" id="reg-confirm-password" name="reg-confirm-password"
                 class="form-control" placeholder="Re-enter your password"
                 data-validate="required" data-label="Confirm password">
          <div class="invalid-feedback"></div>
        </div>

        <button type="submit" class="btn-teal-custom w-100 mt-1" style="border-radius:var(--radius); padding:0.65rem; font-weight:700; border:none; cursor:pointer;">
          <i class="bi bi-person-check me-1"></i> Create Account
        </button>

      </form>
    </div>

  </div><!-- /.auth-card -->
</div><!-- /.auth-wrapper -->

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../main.js"></script>
<script src="../js/validation.js"></script>
<!-- Auth: session management, login/register/navbar logic all in auth.js -->
<script src="../js/auth.js"></script>
<script>
  // Render navbar (login page is public — just show guest links)
  renderNavbar('../');

  // Redirect already-logged-in users away from login page
  (function () {
    var role = Auth.getRole();
    if (role === 'admin') {
      window.location.href = '../admin/dashboard.html';
    } else if (role === 'user') {
      window.location.href = '../index.html';
    }
  })();

  // Attach real-time validation and password strength once DOM is ready
  document.addEventListener('DOMContentLoaded', function () {
    attachRealTimeValidation(document.getElementById('login-form'));
    attachRealTimeValidation(document.getElementById('register-form'));
    attachPasswordStrength(
      document.getElementById('reg-password'),
      document.getElementById('reg-strength-bar')
    );
  });
</script>
</body>
</html>
